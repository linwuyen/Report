name: ASR5K Analyzer offline tests
on:
  push:
    paths:
      - 'asr5k-log-analyzer/**'
      - '.github/workflows/asr5k-analyzer.yml'
  pull_request:
    paths:
      - 'asr5k-log-analyzer/**'
      - '.github/workflows/asr5k-analyzer.yml'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: asr5k-log-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q asr5k analyzer.py
      - name: Legacy simulation smoke
        run: python analyzer.py --input samples/demo.jsonl --output reports/demo.json --demo
      - name: LA simulator smoke
        run: python analyzer.py analyze --input samples/la_demo.csv --format la-csv --profile profiles/la_example_unverified.json --output reports/la.json --demo
